services:
  - type: web
    name: skillvaya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m py_compile app.py
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SKILLVAYA_PAYFAST_MODE
        value: sandbox
      - key: SKILLVAYA_PUBLIC_URL
        sync: false
      - key: SKILLVAYA_PAYFAST_MERCHANT_ID
        sync: false
      - key: SKILLVAYA_PAYFAST_MERCHANT_KEY
        sync: false
      - key: SKILLVAYA_PAYFAST_PASSPHRASE
        sync: false
      - key: SKILLVAYA_OWNER_EMAIL
        sync: false
      - key: SKILLVAYA_OWNER_PASSWORD
        sync: false
