services:
  - type: web
    name: skillvaya
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m py_compile app.py
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SKILLVAYA_PUBLIC_URL
        value: https://skillvaya.onrender.com
      - key: SKILLVAYA_PAYPAL_MODE
        value: sandbox
      - key: SKILLVAYA_PAYPAL_CLIENT_ID
        sync: false
      - key: SKILLVAYA_PAYPAL_CLIENT_SECRET
        sync: false
      - key: SKILLVAYA_OWNER_EMAIL
        sync: false
      - key: SKILLVAYA_OWNER_PASSWORD
        sync: false
