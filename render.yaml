services:
  - type: web
    name: skillvaya
    runtime: python
    plan: starter
    buildCommand: python -m py_compile app.py
    startCommand: python app.py
    healthCheckPath: /healthz
    disk:
      name: skillvaya-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SKILLVAYA_DB_PATH
        value: /var/data/skillvaya.sqlite3
      - key: SKILLVAYA_PAYFAST_MODE
        value: sandbox
      - key: SKILLVAYA_PUBLIC_URL
        sync: false
      - key: SKILLVAYA_PAYFAST_MERCHANT_ID
        sync: false
      - key: SKILLVAYA_PAYFAST_MERCHANT_KEY
        sync: false
      - key: SKILLVAYA_PAYFAST_PASSPHRASE
        sync: false
