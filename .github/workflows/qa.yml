name: Skillvaya QA

on:
  push:
    branches: [main, free-hosting-postgres]
  pull_request:
    branches: [main, free-hosting-postgres]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and verification scripts
        run: >-
          python -m py_compile app.py run_local.py desktop_launcher.py
          qa_one_go.py verify_owner_app_shell.py verify_payfast_checkout.py
          test_deployment_owner_bootstrap.py test_owner_promotions.py
      - name: Run isolated marketplace end-to-end QA
        run: python qa_one_go.py
      - name: Verify owner app navigation and payment-readiness messaging
        run: python verify_owner_app_shell.py
      - name: Verify PayFast sandbox checkout safeguards
        run: python verify_payfast_checkout.py
      - name: Verify production owner bootstrap and password hashing
        run: python test_deployment_owner_bootstrap.py
      - name: Verify owner promotions
        run: python test_owner_promotions.py

  postgres-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillvaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillvaya"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillvaya
      SKILLVAYA_OWNER_EMAIL: owner-ci@example.com
      SKILLVAYA_OWNER_PASSWORD: ci-test-password-12345
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py qa_one_go.py
      - name: Run marketplace end-to-end QA on PostgreSQL
        run: python qa_one_go.py
