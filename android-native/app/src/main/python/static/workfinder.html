<script>
'use strict';
let jobs=[];
const names=['Welcome','Sign in','Create account','Home','Job details','Apply for a job','My applications','Messages','My profile','Edit profile','CV and documents','Post a job','Employer dashboard','Notifications','Settings','Conversation','Jobs'];
let page=0,jobIndex=0,saved=new Set(),apps=[],chat=[],workWanted=[],savedSearches=[],reports=[],blockedUsers=new Set(),profilePhoto='',wfConversations=[],wfActiveConversationId=0,wfActivePartnerName='WorkFinder contact',wfMessagePoll=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let wfUser=null,wfToken='';try{wfToken=localStorage.getItem('skillvaya_token')||localStorage.getItem('sv_token')||'';wfUser=JSON.parse(localStorage.getItem('skillvaya_user')||'null')}catch(e){}
async function wfApi(path,method='GET',payload){const h={'Content-Type':'application/json'};if(wfToken)h.Authorization='Bearer '+wfToken;const r=await fetch(path,{method,headers:h,credentials:'same-origin',body:payload===undefined?undefined:JSON.stringify(payload)});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||'Request failed ('+r.status+')');return d}
async function wfLogin(){const a=[...document.querySelectorAll('#content input')].filter(x=>x.type!=='checkbox'&&x.type!=='file');const email=(a.find(x=>x.type==='email')||{}).value||'',password=(a.find(x=>x.type==='password')||{}).value||'';if(!email.trim()||!password){toast('Enter your email and password.');return}try{const d=await wfApi('/api/login','POST',{email:email.trim(),password,accept_terms:true});wfToken=d.token;wfUser=d.user;try{localStorage.setItem('skillvaya_token',wfToken);localStorage.setItem('sv_token',wfToken);localStorage.setItem('skillvaya_user',JSON.stringify(wfUser));const rem=document.getElementById('rememberMe');if(rem&&rem.checked)localStorage.setItem('skillvaya.workfinder.email',email.trim())}catch(e){}toast('Signed in to SkillVaya');await loadWfData();go(3)}catch(e){toast(e.message)}}
function wfSignOut(){wfToken='';wfUser=null;try{localStorage.removeItem('skillvaya_token');localStorage.removeItem('sv_token');localStorage.removeItem('skillvaya_user')}catch(e){}apps=[];saved.clear();go(0);toast('Signed out of WorkFinder.')}
async function wfSignup(){const a=[...document.querySelectorAll('#content input')].filter(x=>x.type!=='checkbox'&&x.type!=='file');const name=a.find(x=>x.type==='text')?.value||'',email=a.find(x=>x.type==='email')?.value||'',pw=a.filter(x=>x.type==='password'),agree=document.getElementById('termsAgree');if(!name.trim()||!email.trim()||!pw[0]?.value||pw[0].value!==pw[1]?.value){toast('Complete your name, email and matching passwords.');return}if(!agree?.checked){toast('Accept SkillVaya terms before creating an account.');return}try{const role=document.querySelector('#content select')?.selectedIndex===1?'provider':'customer';const d=await wfApi('/api/signup','POST',{name:name.trim(),email:email.trim(),password:pw[0].value,role,accept_terms:true});wfToken=d.token;wfUser=d.user;try{localStorage.setItem('skillvaya_token',wfToken);localStorage.setItem('sv_token',wfToken);localStorage.setItem('skillvaya_user',JSON.stringify(wfUser))}catch(e){}toast('SkillVaya account created');await loadWfData();go(3)}catch(e){toast(e.message)}}
async function loadWfData(){if(!wfToken)return;try{const [ap,sv,pr]=await Promise.all([wfApi('/api/workfinder/applications'),wfApi('/api/workfinder/saved'),wfApi('/api/workfinder/profile')]);apps=(ap.items||[]).map(x=>({...x}));saved=new Set((sv.items||[]).filter(x=>!x.removed).map(x=>Number(x.job_index)).filter(Number.isFinite));if(pr.items?.length){const x=pr.items.find(y=>y.key==='main')||{};const pf=pr.items.find(y=>y.key==='portfolio_files'),df=pr.items.find(y=>y.key==='documents'),bp=pr.items.find(y=>y.key==='business'),bf=pr.items.find(y=>y.key==='business_files');profilePhoto=x.photo||profilePhoto;wfProfile=x;wfSavedPortfolioFiles=pf?.files||[];wfSavedDocumentFiles=df?.files||[];wfBusinessProfile=bp||{};wfSavedBusinessFiles=bf?.files||[]}await loadWfConversations()}catch(e){if(/sign in/i.test(e.message))toast('Please sign in to sync WorkFinder data.')}}
let wfProfile={},wfSavedPortfolioFiles=[],wfSavedDocumentFiles=[],wfBusinessProfile={},wfSavedBusinessFiles=[],wfPendingBusinessFiles=[],wfPendingChatFiles=[];
async function saveWfProfile(){
 const c=document.querySelectorAll('#content input');
 const ta=document.querySelectorAll('#content textarea');
 const vals=[...c].filter(x=>x.type!=='file').map(x=>x.value);
 const payload={name:vals[0]||'',headline:vals[1]||'',location:vals[2]||'',email:vals[3]||'',phone:vals[4]||'',summary:ta[0]?.value||'',skills:vals[5]||'',experience:ta[1]?.value||'',portfolio:ta[2]?.value||'',photo:profilePhoto||''};
 if(!wfToken){toast('Sign in to save your profile.');go(1);return}
 if(await persistWf('profile','main',payload)){wfProfile=payload;if(wfPendingPortfolioFiles.length){const ok=await persistWf('profile','portfolio_files',{files:wfPendingPortfolioFiles.map(({name,type,size,data})=>({name,type,size,data}))});if(!ok)return;wfSavedPortfolioFiles=wfPendingPortfolioFiles.slice();wfPendingPortfolioFiles=[];const label=document.getElementById('wfPortfolioFileNames');if(label)label.textContent='Portfolio files uploaded and saved';}toast('Profile saved to your SkillVaya account.')}
}

let wfPendingPortfolioFiles=[],wfPendingDocumentFiles=[];
async function wfChooseUploads(input,kind){const files=Array.from(input.files||[]),status=input.closest('.card')?.querySelector('.fileNames')||document.getElementById('wfPortfolioFileNames');if(!files.length)return;const max=1572864,total=files.reduce((n,f)=>n+f.size,0),allowed=kind==='portfolio'?['image/jpeg','image/png','image/webp','application/pdf']:['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','image/jpeg','image/png','image/webp'];if(total>max){input.value='';if(status)status.textContent='Files exceed the 1.5 MB combined limit. Choose smaller files.';toast('Files exceed the 1.5 MB combined limit.');return}if(files.some(f=>!allowed.includes(f.type))){input.value='';if(status)status.textContent='Unsupported file type. Choose an allowed document or image.';toast('Unsupported file type.');return}const reader=f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,type:f.type,size:f.size,data:String(r.result||'')});r.onerror=()=>reject(Error('Could not read '+f.name));r.readAsDataURL(f)});try{const loaded=await Promise.all(files.map(reader));if(kind==='portfolio'){wfPendingPortfolioFiles=loaded;if(status)status.textContent=loaded.map(f=>f.name+' ('+Math.ceil(f.size/1024)+' KB)').join(' · ')}else if(kind==='business'){wfPendingBusinessFiles=loaded;if(status)status.textContent=loaded.map(f=>f.name+' ('+Math.ceil(f.size/1024)+' KB)').join(' · ')}else{const category=Number(input.dataset.wfDocType||0),combined=wfPendingDocumentFiles.concat(loaded.map(f=>({...f,category})));if(combined.reduce((n,f)=>n+f.size,0)>1572864){if(status)status.textContent='All selected documents together must be 1.5 MB or less.';toast('All selected documents together must be 1.5 MB or less.');return}wfPendingDocumentFiles=combined;if(status)status.textContent=wfPendingDocumentFiles.filter(f=>f.category===category).map(f=>f.name+' ('+Math.ceil(f.size/1024)+' KB)').join(' · ')}toast(files.leng
