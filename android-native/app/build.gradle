plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'com.google.gms.google-services'
}
android {
    namespace 'za.co.skillvaya.app'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        def rawPublicUrl = (System.getenv('SKILLVAYA_PUBLIC_URL') ?: '').trim()
        if (!rawPublicUrl.isEmpty() && !rawPublicUrl.startsWith('https://')) {
            throw new GradleException('SKILLVAYA_PUBLIC_URL must be HTTPS for hosted builds.')
        }
        def publicUrl = rawPublicUrl.replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'PUBLIC_URL', '"' + publicUrl + '"'
        manifestPlaceholders = [allowCleartextTraffic: rawPublicUrl.isEmpty() ? 'true' : 'false']
        applicationId 'za.co.skillvaya.app'
        minSdk 24
        targetSdk 36
        versionCode 87
        versionName '7.2.0.2'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    signingConfigs {
        release {
            def ksPath = System.getenv('SKILLVAYA_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('SKILLVAYA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SKILLVAYA_KEY_ALIAS')
                keyPassword System.getenv('SKILLVAYA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'FULL' }
            if (System.getenv('SKILLVAYA_KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Billing 9.1.0 brings older transitive Kotlin JDK7/JDK8 artifacts through
// coroutines/AndroidX. Kotlin 1.8+ has these classes merged into kotlin-stdlib;
// exclude the legacy jars to avoid duplicate classes in release bundles.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation platform("com.google.firebase:firebase-bom:35.1.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-auth"
    // Chatmoji Lenses camera (on-device face tracking and background separation)
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.activity:activity:1.9.3"
    implementation "com.google.mlkit:face-detection:16.1.7"
    implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
}
chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython("C:/Users/user/AppData/Local/Programs/Python/Python311/python.exe")
    }
}

